<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlabCalc — Concrete Estimating</title>
<!-- Leaflet and fonts are bundled in ./vendor (run `npm run vendor`) so the app works offline -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
:root{--ink:#1C1F23;--muted:#5B6068;--line:#E2E0DB;--bg:#F4F3F0;--panel:#fff;--accent:#C2560C;--accent-soft:#FFF1E6;--accent-ink:#8A3D08;--drive:#E06A12;--walk:#2F6FE0;--patio:#2F8F5B}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
h1,h2,h3,.disp{font-family:'Space Grotesk',Inter,sans-serif}
a{color:#B4500B}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{height:40px;padding:0 14px;border-radius:8px;border:1px solid #D5D2CC;background:#fff;display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#A8A49C}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:#A9490A}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:#A1261C}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn[aria-pressed=true]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],select,textarea{border:1px solid #D5D2CC;border-radius:8px;padding:8px 10px;background:#fff;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;line-height:1.15}
.huge{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;letter-spacing:-1px;line-height:1.1}

/* header */
header.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
header.top .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:18px;color:#fff;text-decoration:none}
header.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
header.top nav a{color:#C9CCD1;text-decoration:none;padding:9px 13px;border-radius:8px;font-size:14px}
header.top nav a.on{background:#2B2F35;color:#fff;font-weight:600}
main{padding:20px;max-width:1500px;margin:0 auto}

/* estimate list */
.elist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px}
.ecard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.ecard:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ecard .thumb{height:130px;background:#F4F3F0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ecard .thumb svg{width:100%;height:100%;border:none!important;border-radius:0!important}
.ecard .body{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ecard .meta{font-size:12.5px;color:var(--muted)}

/* job */
.jobhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps a{padding:8px 14px;border-radius:20px;background:#E2E0DB;color:#3C4047;text-decoration:none;font-size:13px}
.steps a.on{background:var(--ink);color:#fff;font-weight:600}
.split{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.split>.main{flex:999 1 620px;min-width:0}
.split>.side{flex:1 1 380px;min-width:0}
fieldset.q{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;margin:0 0 10px}
fieldset.q legend{float:left;width:100%;padding:0;font-weight:600;font-size:15px}
fieldset.q .why{clear:both;font-size:13px;color:var(--muted);margin-bottom:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid #D5D2CC;background:#fff;font-size:14px;margin:0 6px 6px 0}
.chip[aria-pressed=true]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
ol.plan{list-style:none;margin:0;padding:0}
ol.plan li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #ECEAE5}
ol.plan .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.tag{align-self:flex-start;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;background:#F4F3F0;color:#3C4047}
.tag.add{background:#FDECEC;color:#8A1F1F}.tag.save{background:#EEF4EC;color:#2B4A25}.tag.opt{background:#E8EEF9;color:#1E3F7A}

/* map */
#map{height:min(640px,calc(100vh - 240px));min-height:420px;border-radius:12px;border:1px solid #C9C6BF;background:#5E7448}
.maptools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.hint .btn:not(.primary){color:#1C1F23;background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{background:rgba(28,31,35,.94);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.leaflet-tooltip.plabel{background:rgba(28,31,35,.92);color:#fff;border:none;border-radius:8px;padding:6px 10px;font:12px/1.35 Inter,sans-serif;box-shadow:none}
.leaflet-tooltip.plabel b{font-size:13px}
.leaflet-tooltip.plabel:before{display:none}
.elabel{position:absolute;transform:translate(-50%,-50%);background:#fff;color:#1C1F23;font:600 11.5px/1.2 Inter,sans-serif;padding:2px 6px;border-radius:5px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none}
.vtx{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.vhit{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:move}
.vhit:hover .vtx{transform:scale(1.25)}
.vmid{width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:copy}
.vmid span{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.75);border:2px solid var(--accent);font:700 10px/8px Inter,sans-serif;color:var(--accent);text-align:center}
.vmove{width:34px;height:34px;border-radius:50%;background:#1C1F23;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.5);border:2px solid #fff}
.pourlist button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.pourlist button.on{border:2px solid var(--ink)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
table.lines{width:100%;border-collapse:collapse;font-size:14px}
table.lines td{padding:7px 0;border-bottom:1px solid #ECEAE5;vertical-align:top}
table.lines td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
table.lines .d{font-size:12px;color:var(--muted)}
.xs{display:flex;gap:12px}
.xs .stack{width:110px;flex:none;border:1px solid #C9C6BF;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}

/* photo */
.canv{width:100%;border-radius:10px;border:1px solid var(--line);background:#E8E6E1;display:block}
.finopt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 12px;border-radius:10px;border:1px solid #D5D2CC;background:#fff;margin-bottom:8px;text-align:left}
.finopt[aria-pressed=true]{border:2px solid var(--accent);background:var(--accent-soft)}
.sw{width:34px;height:34px;border-radius:6px;border:1px solid #A8A49C;flex:none}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:5000;padding:20px}
.modal{background:#fff;border-radius:14px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6000}
#toast.show{opacity:1}

/* proposal */
.pages{display:flex;flex-direction:column;align-items:center;gap:24px}
.page{width:8.5in;height:11in;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.15);position:relative;overflow:hidden;display:flex;flex-direction:column;color:#1C1F23;font-size:15px}
.page .pad{padding:44px 60px 34px;display:flex;flex-direction:column;gap:16px;flex:1}
.page .runhead{display:flex;justify-content:space-between;font-size:11.5px;color:#5B6068;border-bottom:1px solid #E2E0DB;padding-bottom:9px}
.page .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:11.5px;color:#5B6068}
.page h2{margin:2px 0 0;font-size:30px;line-height:1.15}
.page .kicker{font-size:12.5px;letter-spacing:2px;color:#B4500B;font-weight:600}
.page table{width:100%;border-collapse:collapse;font-size:14px}
.page th{text-align:left;font-size:11.5px;color:#5B6068;letter-spacing:.5px;padding:6px 0;border-bottom:2px solid #1C1F23;font-weight:600}
.page td{padding:7px 0;border-bottom:1px solid #D5D2CC}
.page td.r,.page th.r{text-align:right}
.page img.hero{width:100%;height:420px;object-fit:cover;border-radius:10px;display:block}
.tier{border:1px solid #A8A49C;border-radius:10px;padding:10px 12px;position:relative}
.tier.on{border:2px solid #1C1F23}
.tier .badge{position:absolute;top:-10px;left:10px;background:#1C1F23;color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px}
.box{width:16px;height:16px;border:2px solid #1C1F23;border-radius:3px;display:inline-block;vertical-align:-3px;margin-right:6px}
.ph{background:#FFF6CC}

@media print{
  @page{size:letter;margin:0}
  body{background:#fff}
  header.top,.noprint,.steps,.jobhead{display:none!important}
  main{padding:0;max-width:none}
  .pages{gap:0;display:block}
  .page{box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .ph{background:none}
}
</style>
</head>
<body>
<header class="top noprint">
  <a class="brand" href="#/">
    <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="14" width="24" height="10" rx="2" fill="#E06A12"/><rect x="2" y="9" width="24" height="4" rx="1" fill="#9AA0A8"/><path d="M6 9 L11 4 L16 9" stroke="#fff" stroke-width="2" fill="none"/></svg>
    SlabCalc
  </a>
  <nav aria-label="Main">
    <a href="#/" id="nav-crm">Estimates</a>
    <a href="#/settings" id="nav-set">Prices &amp; company</a>
  </nav>
</header>
<main id="view"></main>
<div id="toast" role="status"></div>

<script>
'use strict';
/* =========================================================
   STORAGE
   ========================================================= */
const KEY = 'slabcalc.v1';
const DEFAULT_SETTINGS = {
  company: '', phone: '', email: '', license: '', city: '',
  priceYard: 165, waste: 10, roundYard: 0.25, shortLoadMin: 5, shortLoadFee: 150,
  pumpFee: 450, buggySqft: 1.00,
  demoConcreteSqft: 2.50, demoAsphaltSqft: 1.75, sodSqft: 0.60,
  gravelTon: 38, gravelReuse: 50, fabricSqft: 0.35,
  rebarSqft: 0.85, dowelFlat: 150, formsLf: 1.75, laborSqft: 4.50,
  taxPct: 7, markupPct: 15,
  /* simple pricing: installed price per sq ft by slab thickness (removal, pump/buggy and finish upgrades extra) */
  pricingMode: 'sqft', sqft4: 12, sqft5: 14, sqft6: 16, sqft8: 20, sqftMarkupPct: 0,
  fin_broom: 0, fin_charcoal: 1.25, fin_aggregate: 3.50, fin_stamped: 6.00,
  proof: [], freeCancel: true, guaranteePct: 20, warrantyYears: 2, dep1: 30, dep2: 40, dep3: 30, validDays: 30, workDays: 3,
  bonuses: [
    { name: '', value: '' },
    { name: '1-year check-up visit — we re-inspect every panel', value: '' },
    { name: 'Before / after photo set of your home', value: '' },
    { name: 'Lawn repair along the new edges (seed + straw)', value: '' }
  ]
};
let DB = load();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.jobs) { d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {}); return d; }
  } catch (e) {}
  return { jobs: [], settings: Object.assign({}, DEFAULT_SETTINGS) };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast('Could not save — storage is full. Export a backup.'); }
}
const uid = () => Math.random().toString(36).slice(2, 10);
let LOGO = null; /* company logo data URL, loaded from IndexedDB at start */
const S = () => DB.settings;
const getJob = id => DB.jobs.find(j => j.id === id);

/* photos live in IndexedDB (too big for localStorage) */
const idb = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('slabcalc-photos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('p');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  return {
    async get(k) { try { const d = await open(); return await new Promise(res => { const q = d.transaction('p').objectStore('p').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } },
    async set(k, v) { try { const d = await open(); await new Promise(res => { const t = d.transaction('p', 'readwrite'); t.objectStore('p').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} },
    async del(k) { try { const d = await open(); d.transaction('p', 'readwrite').objectStore('p').delete(k); } catch (e) {} }
  };
})();

/* =========================================================
   HELPERS
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, d = 0) => (n || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: d, minimumFractionDigits: d });
const num = (n, d = 0) => (n || 0).toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
const ph = (v, label) => v ? esc(v) : `<span class="ph">[${label}]</span>`;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }
function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
/* dates are local calendar days (toISOString is UTC and rolls over to tomorrow in the evening) */
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function addDays(iso, n) { const d = iso ? new Date(iso + 'T12:00:00') : new Date(); d.setDate(d.getDate() + n); return isoLocal(d); }
function addWorkDays(iso, n) { if (!iso) return ''; const d = new Date(iso + 'T12:00:00'); let k = 0; while (k < n - 1) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w && w !== 6) k++; } return isoLocal(d); }
const today = () => isoLocal(new Date());

/* =========================================================
   GEOMETRY (lat/lng <-> local feet)
   ========================================================= */
/* local tangent frame; WGS84 feet-per-degree at the pour's latitude */
const M2FT = 3.280839895;
function frame(pts) {
  const lat0 = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const lng0 = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  const phi = lat0 * Math.PI / 180;
  const ky = (111132.92 - 559.82 * Math.cos(2 * phi) + 1.175 * Math.cos(4 * phi)) * M2FT;
  const kx = (111412.84 * Math.cos(phi) - 93.5 * Math.cos(3 * phi)) * M2FT;
  return {
    toXY: p => [(p[1] - lng0) * kx, (p[0] - lat0) * ky],
    toLL: q => [q[1] / ky + lat0, q[0] / kx + lng0]
  };
}
function polyArea(xy) { let a = 0; for (let i = 0; i < xy.length; i++) { const p = xy[i], q = xy[(i + 1) % xy.length]; a += p[0] * q[1] - q[0] * p[1]; } return Math.abs(a) / 2; }
function polyPerim(xy) { let s = 0; for (let i = 0; i < xy.length; i++) { const p = xy[i], q = xy[(i + 1) % xy.length]; s += Math.hypot(q[0] - p[0], q[1] - p[1]); } return s; }
function rot(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[1] * s, -p[0] * s + p[1] * c]; }
function unrot(p, a) { return rot(p, -a); }
function obb(xy) {
  let best = null;
  for (let i = 0; i < xy.length; i++) {
    const p = xy[i], q = xy[(i + 1) % xy.length];
    const a = Math.atan2(q[1] - p[1], q[0] - p[0]);
    const r = xy.map(v => rot(v, a));
    const xs = r.map(v => v[0]), ys = r.map(v => v[1]);
    const b = { a, minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
    b.area = (b.maxX - b.minX) * (b.maxY - b.minY);
    if (!best || b.area < best.area) best = b;
  }
  return best;
}
function segInt(p, p2, a, b) {
  const r = [p2[0] - p[0], p2[1] - p[1]], s = [b[0] - a[0], b[1] - a[1]];
  const den = r[0] * s[1] - r[1] * s[0];
  if (Math.abs(den) < 1e-12) return null;
  const t = ((a[0] - p[0]) * s[1] - (a[1] - p[1]) * s[0]) / den;
  const u = ((a[0] - p[0]) * r[1] - (a[1] - p[1]) * r[0]) / den;
  return (u >= 0 && u <= 1) ? t : null;
}
function clipLine(p, p2, poly) {
  const ts = [];
  for (let i = 0; i < poly.length; i++) { const t = segInt(p, p2, poly[i], poly[(i + 1) % poly.length]); if (t !== null && t >= 0 && t <= 1) ts.push(t); }
  ts.sort((x, y) => x - y);
  const uniq = ts.filter((t, i) => i === 0 || t - ts[i - 1] > 1e-6);
  const out = [];
  for (let i = 0; i + 1 < uniq.length; i += 2) {
    const A = [p[0] + (p2[0] - p[0]) * uniq[i], p[1] + (p2[1] - p[1]) * uniq[i]];
    const B = [p[0] + (p2[0] - p[0]) * uniq[i + 1], p[1] + (p2[1] - p[1]) * uniq[i + 1]];
    if (Math.hypot(B[0] - A[0], B[1] - A[1]) > 0.5) out.push([A, B]);
  }
  return out;
}
/* measure one pour: area, perimeter, length/width, joint layout.
   Walkways drawn as a centerline (pour.path + pour.width) get panels that follow the path. */
function measurePour(pour) {
  if (pour.path && pour.path.length >= 2) return measurePath(pour);
  if (!pour.pts || pour.pts.length < 3) return null;
  const F = frame(pour.pts);
  const xy = pour.pts.map(F.toXY);
  const area = polyArea(xy), perim = polyPerim(xy);
  const b = obb(xy);
  const dx = b.maxX - b.minX, dy = b.maxY - b.minY;
  const alongX = dx >= dy;
  const L = Math.max(dx, dy), W = Math.min(dx, dy);
  const t = pour.thick || 4;
  const max = Math.min(t * 2.5, 15);
  const nW = Math.max(1, Math.ceil(W / max - 1e-9));
  const pw = W / nW;
  const nL = Math.max(1, Math.ceil(L / Math.min(max, pw * 1.25) - 1e-9));
  const pl = L / nL;
  const joints = [];
  const ext = 2;
  const addLine = (P, Q) => { clipLine(unrot(P, b.a), unrot(Q, b.a), xy).forEach(s => joints.push(s.map(F.toLL))); };
  if (alongX) {

   ESTIMATE

  { id: 'aggregate', name: 'Textured', desc: 'Exposed aggregate', key: 'fin_aggregate', color: '#B3A48E' },

function estimate(job, finishId) {

    pours.forEach(x => {
      const t = x.p.thick || 4, r = sqftRate(P, t);

    if (A.access === 'pump') L('Pump truck', '', P.pumpFee, false, '');

    const upg = f => P[f.key] > 0 ? area * P[f.key] : 0;

  if (A.now === 'concrete') L('Tear-out & haul-away', `${num(area)} sq ft of old concrete`, area * P.demoConcreteSqft, false);
  if (A.now === 'asphalt') L('Asphalt removal & haul-away', `${num(area)} sq ft`, area * P.demoAsphaltSqft, false);

  if (A.soil === 'soft') L('Geotextile fabric', `${num(area)} sq ft`, area * P.fabricSqft, true);

          <div class="meta">${esc(j.address || 'No address yet')}</div>
          <div class="meta">${E ? esc(projectTitle(j)) + ' · ' + num(E.area) + ' sq ft · ' : ''}No. ${esc(j.proposalNo || '')} · ${j.updated ? fmtDate(isoLocal(new Date(j.updated))) : ''}</div>
        </div>
      </a>`;
    }).join('')}
  </div>`;
  hydrateSat($('#view'));
  $('#newlead').onclick = () => leadModal();
  $('#bk-exp').onclick = exportBackup;
  $('#bk-imp').onchange = e => { importBackup(e.target.files[0]); e.target.value = ''; };
  const s = $('#srch');
  if (s) s.oninput = () => { renderCRM.q = s.value; const pos = s.selectionStart; renderCRM(); const n = $('#srch'); n.focus(); n.setSelectionRange(pos, pos); };
}
function nextProposalNo() { return String(DB.jobs.reduce((m, j) => Math.max(m, parseInt(j.proposalNo, 10) || 1000), 1000) + 1); }
function leadModal(job) {
  const j = job || {};
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<form class="modal" aria-label="Customer">
    <h2 style="margin:0 0 12px">${job ? 'Edit customer' : 'New estimate'}</h2>
    <div style="display:grid;gap:10px">
      <label class="f">Customer name<input type="text" name="name" required value="${esc(j.name)}"></label>
      <label class="f">Property address<input type="text" name="address" value="${esc(j.address)}" placeholder="Street, city, state"></label>
      <div class="grid2"><label class="f">Phone<input type="tel" name="phone" value="${esc(j.phone)}"></label><label class="f">Email<input type="email" name="email" value="${esc(j.email)}"></label></div>
      <label class="f">Notes<textarea name="notes">${esc(j.notes)}</textarea></label>
    </div>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      ${job ? '<button type="button" class="btn danger" data-del style="margin-right:auto">Delete estimate</button>' : ''}
      <button type="button" class="btn" data-x>Cancel</button><button class="btn primary">${job ? 'Save' : 'Create and start'}</button>
    </div></form>`;
  document.body.appendChild(bg);
  const f = bg.querySelector('form');
  f.elements.namedItem('name').focus();
  const close = () => { bg.remove(); document.removeEventListener('keydown', onEsc); };
  const onEsc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onEsc);
  bg.querySelector('[data-x]').onclick = close;
  bg.onmousedown = e => { if (e.target === bg) close(); };
  const del = bg.querySelector('[data-del]');
  if (del) del.onclick = () => {
    if (del.dataset.sure) { DB.jobs = DB.jobs.filter(x => x.id !== job.id); idb.del('before:' + job.id); idb.del('after:' + job.id); save(); close(); if (location.hash === '#/') route(); else location.hash = '#/'; toast('Estimate deleted'); }
    else { del.dataset.sure = 1; del.textContent = 'Click again to delete for good'; }
  };
  f.onsubmit = e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f).entries());
    if (job) { const addrChanged = d.address !== job.address; Object.assign(job, d, { updated: Date.now() }); if (addrChanged) { job.center = null; } save(); close(); route(); return; }
    const nj = Object.assign({ id: uid(), created: Date.now(), updated: Date.now(), answers: Object.assign({}, DEFAULT_ANSWERS), pours: [], finish: 'broom', proposalNo: nextProposalNo() }, d);
    DB.jobs.push(nj); save(); close();
    location.hash = `#/job/${nj.id}/questions`;
  };
}
function duplicateJob(job) {
  const c = JSON.parse(JSON.stringify(job));
  Object.assign(c, { id: uid(), name: job.name + ' (copy)', created: Date.now(), updated: Date.now(), proposalNo: nextProposalNo(), proposalDate: '', trace: [], photoFit: null });
  c.pours.forEach(p => p.id = uid());
  DB.jobs.push(c); save(); location.hash = `#/job/${c.id}/questions`; toast('Copied — photo not included');
}
async function exportBackup() {
  /* photos ride along so a restore (or a single-estimate file) is complete */
  const jobs = await Promise.all(DB.jobs.map(async j => {
    const before = await idb.get('before:' + j.id), after = await idb.get('after:' + j.id);
    return (before || after) ? Object.assign({}, j, { photos: { before, after } }) : j;
  }));
  const proof = {};
  for (const ph of (DB.settings.proof || [])) { const d = await idb.get('proof:' + ph.id); if (d) proof[ph.id] = d; }
  const logo = await idb.get('logo');
  const blob = new Blob([JSON.stringify({ jobs, settings: DB.settings, proof, logo: logo || undefined })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `slabcalc-backup-${today()}.json`; a.click();
  toast('Backup downloaded');
}
function importBackup(file) {
  if (!file) return;
  /* merge: estimates are added or updated by id; prices/company only change if the file has them */
  file.text().then(t => {
    const d = JSON.parse(t); if (!Array.isArray(d.jobs)) { if (d.proof || d.settingsPatch || d.logo) d.jobs = []; else throw 0; }
    if (typeof d.logo === 'string' && d.logo.startsWith('data:image/')) { LOGO = d.logo; idb.set('logo', d.logo); }
    let added = 0, updated = 0;
    d.jobs.forEach(j => { if (!j.proposalNo) j.proposalNo = nextProposalNo();
      if (j.photos) { if (j.photos.before) idb.set('before:' + j.id, j.photos.before); if (j.photos.after) idb.set('after:' + j.id, j.photos.after); delete j.photos; } const i = DB.jobs.findIndex(x => x.id === j.id); if (i >= 0) { DB.jobs[i] = j; updated++; } else { DB.jobs.push(j); added++; } });
    if (d.settings) DB.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings);
    /* a setup file can fill in company details without touching prices */
    if (d.settingsPatch && typeof d.settingsPatch === 'object') ['company', 'phone', 'email', 'license', 'freeCancel', 'dep1', 'dep2', 'dep3'].forEach(k => { if (k in d.settingsPatch) DB.settings[k] = d.settingsPatch[k]; });
    if (d.proof) Object.entries(d.proof).forEach(([id, data]) => {
      idb.set('proof:' + id, data);
      /* a photos-only file adds to your proof photos without touching prices */
      const P = DB.settings; P.proof = P.proof || [];
      if (!d.settings && !P.proof.some(x => x.id === id)) P.proof.push({ id, caption: (d.proofCaptions || {})[id] || '' });
    });
    save(); route(); toast(`Imported: ${added} new, ${updated} updated` + (d.proof ? ` · ${Object.keys(d.proof).length} proof photos` : '') + (d.settingsPatch ? ' · company info updated' : '') + (d.settings ? ' · prices restored' : ''));
  })
    .catch(() => toast('That file is not a SlabCalc backup'));
}

function touch(job) { job.updated = Date.now(); save(); }
function refreshHeaderTotal(job) { const el = $('#hdr-total'); if (el) { const E = estimate(job); el.textContent = E.pours.length ? money(E.total) : '—'; const pn = $('#hdr-profit'); if (pn) pn.innerHTML = profitNote(E); } }
function profitNote(E) {

        </div>
        <h3 style="margin:0">Work plan</h3>

        <ol class="plan">${steps.map((s, i) => `<li><span class="n">${i + 1}</span><span style="flex:1"><b class="small">${s.title}</b><span class="small" style="display:block;color:#3C4047">${s.detail}</span></span>${s.tag ? `<span class="tag ${s.cls}">${s.tag}</span>` : ''}</li>`).join('')}</ol>
        <a class="btn primary" style="width:100%;justify-content:center;margin-top:14px;height:46px" href="#/job/${job.id}/map">Next: outline the pours on the map →</a>

/* =========================================================
   TAB 2: MAP & POURS
   ========================================================= */
const KIND = { driveway: { name: 'Driveway', color: '#E06A12' }, walkway: { name: 'Walkway', color: '#2F6FE0' }, patio: { name: 'Patio / pad', color: '#2F8F5B' } };
function renderMapTab(job) {
  if (typeof L === 'undefined') { $('#tab').innerHTML = '<div class="card">The map needs an internet connection to load. Connect and reload.</div>'; return; }
  $('#tab').innerHTML = `<div class="split">
    <section class="main">
      <div class="maptools">
        <form id="geo" class="row" style="flex:1 1 360px">
          <input type="text" id="addr" value="${esc(job.address)}" placeholder="Property address" style="flex:1;min-width:200px" aria-label="Property address">
          <button class="btn dark">Find</button>
        </form>
        <button class="btn primary" data-draw="driveway">+ Driveway</button>
        <button class="btn" data-draw="walkway" style="border-color:#2F6FE0">+ Walkway</button>
        <button class="btn" data-draw="patio" style="border-color:#2F8F5B">+ Patio / pad</button>
        <button class="btn" id="viewtog" aria-pressed="true" title="Show pours as finished concrete or as colored outlines">Concrete view</button>
      </div>
      <div style="position:relative">
        <div id="map"></div>
        <div id="drawhint" class="hint" style="position:absolute;left:56px;top:12px;right:12px;z-index:900;display:none;max-width:560px"></div>
      </div>
      <div class="small muted" style="margin-top:6px">Satellite imagery is good to about ±1 ft. Zoom all the way in. Driveways and patios: click each corner, then click the first point (or Finish). Walkways: click along the middle of the walk, then set the width. Drag the white dots to adjust.</div>
    </section>
    <aside class="side" id="panel"></aside></div>`;

  const map = L.map('map', { zoomControl: true, maxZoom: 22 });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 22, maxNativeZoom: 19, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics'
  }).addTo(map);
  L.control.scale({ imperial: true, metric: false }).addTo(map);
  if (job.center) map.setView(job.center, job.zoom || 20);
  else if (job.pours && job.pours.length) map.fitBounds(L.latLngBounds(job.pours.flatMap(p => p.pts)), { maxZoom: 20 });
  else { map.setView([39.77, -86.16], 12); if (job.address) geocode(job.address); }
  setTimeout(() => map.invalidateSize(), 50);
  map.on('moveend', () => { job.center = [map.getCenter().lat, map.getCenter().lng]; job.zoom = map.getZoom(); save(); });

  const layer = L.layerGroup().addTo(map);
  const vtxLayer = L.layerGroup().addTo(map);
  let selId = job.pours && job.pours[0] ? job.pours[0].id : null;
  let drawing = null; // {kind, pts, line, marks, path}
  let concrete = true; // show pours as finished concrete panels

  async function geocode(q) {
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=' + encodeURIComponent(q));
      const d = await r.json();
      if (!d.length) { toast('Address not found — pan to it by hand'); return; }
      map.setView([+d[0].lat, +d[0].lon], 20);
      L.circleMarker([+d[0].lat, +d[0].lon], { radius: 6, color: '#fff', fillColor: '#C2560C', fillOpacity: 1, weight: 2 }).addTo(map).bindTooltip('Address match', { direction: 'top' });
    } catch (e) { toast('Address search unavailable — pan to it by hand'); }
  }
  $('#geo').onsubmit = e => { e.preventDefault(); const a = $('#addr').value.trim(); if (!a) return; if (a !== job.address) { job.address = a; touch(job); } geocode(a); };

  function drawPours() {
    layer.clearLayers(); vtxLayer.clearLayers();
    (job.pours || []).forEach(p => {
      const m = measurePour(p); if (!m) return;
      const c = KIND[p.kind].color, on = p.id === selId;
      const fin = FINISHES.find(f => f.id === job.finish) || FINISHES[0];
      const poly = concrete
        ? L.polygon(p.pts, { color: on ? '#fff' : c, weight: on ? 3 : 2, fillColor: fin.color, fillOpacity: 0.92 }).addTo(layer)
        : L.polygon(p.pts, { color: on ? '#fff' : c, weight: on ? 3 : 2, fillColor: c, fillOpacity: on ? 0.45 : 0.32 }).addTo(layer);
      const pick = () => { if (!drawing && selId !== p.id) { selId = p.id; drawPours(); drawPanel(); } };
      poly.on('click', pick);
      /* thin walks are hard to hit: an invisible wide line along the path selects them too */
      if (p.path) L.polyline(p.path, { weight: 28, opacity: 0, color: '#000' }).on('click', pick).addTo(layer);
      const jl = m.joints.map(seg => L.polyline(seg, concrete ? { color: '#3B3D40', weight: 2, opacity: 0.85, interactive: false } : { color: '#fff', weight: 2, dashArray: '6 5', interactive: false }).addTo(layer));
      if (p.path && on && !drawing) L.polyline(p.path, { color: '#fff', weight: 1, opacity: 0.6, dashArray: '2 4', interactive: false }).addTo(layer);
      const label = `<b>${esc(p.name)}</b><br>${m.isPath ? num(m.L) + ' ft long × ' + num(m.W, 1) + ' ft wide' : num(m.L) + ' × ' + num(m.W) + ' ft'} · ${num(m.area)} sq ft<br>${m.panels} panels · ${p.thick}″ · ${num(m.yd, 2)} yd³`;
      const small = m.W < 8 || m.isPath;
      /* thin pieces: label on hover only, so it never covers the dots you need to grab */
      poly.bindTooltip(label, { permanent: !small && (on || !concrete), sticky: small, direction: small ? 'top' : 'center', offset: small ? [0, -18] : [0, 0], className: 'plabel' });
      if (on && !drawing) {
        const src = p.path || p.pts, minPts = p.path ? 2 : 3;
        const live = () => { const mm = measurePour(p); poly.setLatLngs(p.pts); jl.forEach(l => layer.removeLayer(l)); jl.length = 0; if (mm) mm.joints.forEach(seg => jl.push(L.polyline(seg, { color: concrete ? '#3B3D40' : '#fff', weight: 2, interactive: false }).addTo(layer))); };
        if (!p.path) m.xy.forEach((a, i) => { const b = m.xy[(i + 1) % m.xy.length], len = Math.hypot(b[0] - a[0], b[1] - a[1]); if (len < 1.5) return; L.marker(m.frame.toLL([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]), { interactive: false, keyboard: false, icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<span class="elabel">${num(len, 1)} ft</span>` }) }).addTo(vtxLayer); });
        src.forEach((pt, i) => {
          const mk = L.marker(pt, { draggable: true, title: 'Drag to move · right-click to delete', icon: L.divIcon({ className: '', html: '<div class="vhit"><div class="vtx"></div></div>', iconSize: [32, 32], iconAnchor: [16, 16] }) }).addTo(vtxLayer);
          mk.on('drag', ev => { src[i] = [ev.latlng.lat, ev.latlng.lng]; live(); });
          const resq = () => { if (p.square && !p.path) p.pts = squarePts(p.pts); };
          mk.on('dragend', () => { resq(); touch(job); drawPours(); drawPanel(); refreshHeaderTotal(job); });
          mk.on('contextmenu', () => { if (src.length > minPts) { src.splice(i, 1); resq(); touch(job); drawPours(); drawPanel(); refreshHeaderTotal(job); } });
        });
        /* + handles between points: click to add a corner (or a bend in a walk) there */
        const segs = p.path ? src.length - 1 : src.length;
        for (let i = 0; i < segs; i++) {
          const a = src[i], b = src[(i + 1) % src.length];
          const t = p.path ? 0.5 : 0.3; /* off-centre on polygons so it doesn't sit on the side-length label */
          const mid = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
          if (map.latLngToContainerPoint(a).distanceTo(map.latLngToContainerPoint(b)) < 40) continue;
          L.marker(mid, { title: 'Click to add a point here', icon: L.divIcon({ className: '', html: '<div class="vmid"><span>+</span></div>', iconSize: [24, 24], iconAnchor: [12, 12] }) })
            .on('click', () => { src.splice(i + 1, 0, mid); if (!p.path) p.square = false; touch(job); drawPours(); drawPanel(); refreshHeaderTotal(job); }).addTo(vtxLayer);
        }
        /* drag the dark handle to move the whole pour */
        const cLL = p.path ? p.path[Math.floor((p.path.length - 1) / 2)].map((v, k) => (v + p.path[Math.ceil((p.path.length - 1) / 2)][k]) / 2) : m.frame.toLL([m.xy.reduce((t, v) => t + v[0], 0) / m.xy.length, m.xy.reduce((t, v) => t + v[1], 0) / m.xy.length]);
        let orig = null;
        L.marker(cLL, { draggable: true, title: 'Drag to move this pour', icon: L.divIcon({ className: '', html: '<div class="vmove">✥</div>', iconSize: [34, 34], iconAnchor: [17, -34] }) })
          .on('dragstart', ev => { orig = { ll: ev.target.getLatLng(), pts: p.pts.map(v => v.slice()), path: p.path ? p.path.map(v => v.slice()) : null }; vtxLayer.eachLayer(l => { if (l !== ev.target) vtxLayer.removeLayer(l); }); })
          .on('drag', ev => { const d = [ev.latlng.lat - orig.ll.lat, ev.latlng.lng - orig.ll.lng]; if (orig.path) { p.path = orig.path.map(v => [v[0] + d[0], v[1] + d[1]]); } p.pts = orig.pts.map(v => [v[0] + d[0], v[1] + d[1]]); live(); })
          .on('dragend', () => { touch(job); drawPours(); drawPanel(); refreshHeaderTotal(job); })
          .addTo(vtxLayer);
      }
    });
  }

  function startDraw(kind) {
    cancelDraw();
    map.doubleClickZoom.disable();
    drawing = { kind, path: kind === 'walkway', pts: [], line: L.polyline([], { color: KIND[kind].color, weight: 3, dashArray: '4 4' }).addTo(map), marks: L.layerGroup().addTo(map) };
    vtxLayer.clearLayers();
    $('#drawhint').style.display = 'block';
    hint();
  }
  function hint() {
    const n = drawing.pts.length, need = drawing.path ? 2 : 3;
    $('#drawhint').innerHTML = (drawing.path
      ? `Drawing a <b>walkway</b>: click along the <b>middle</b> of the walk, end to end, with a click at each bend (${n} so far). Set the width after. `
      : `Drawing a <b>${KIND[drawing.kind].name.toLowerCase()}</b>: click each corner (${n} so far). `) +
      `<div style="margin-top:6px;font-size:12.5px;opacity:.85">${drawing.path ? 'To finish: double-click the last point, click it again, press Enter, or' : 'To finish: click the first point, press Enter, or'}</div><button class="btn sm primary" id="dfin" ${n < need ? 'disabled' : ''} style="margin-top:6px">✓ Finish</button> <button class="btn sm" id="dundo" ${n ? '' : 'disabled'}>Undo</button> <button class="btn sm" id="dcan">Cancel</button>`;

function solveHomography(src, dst) {

    if (Math.abs(A[piv][c]) < 1e-12) return null;

/* ---- satellite backdrop for site plans: Esri tiles stitched into one image, cached in memory + IndexedDB ---- */
const SAT = new Map(), SATDONE = new Map();
const satKey = (b, w, h) => [b.n, b.s, b.e, b.w].map(v => v.toFixed(6)).join(',') + '@' + w + 'x' + h;
const lonToPx = (lng, z) => (lng + 180) / 360 * 256 * 2 ** z;
const latToPx = (lat, z) => { const s = Math.sin(lat * Math.PI / 180); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * 2 ** z; };
function satImage(b, w, h) {
  const key = satKey(b, w, h);
  if (SAT.has(key)) return SAT.get(key);
  const p = (async () => {
    const stored = await idb.get('sat:' + key);
    if (stored) return stored;
    const outW = Math.round(w * 1.6), outH = Math.round(h * 1.6);
    const z = Math.max(1, Math.min(19, Math.floor(Math.log2(outW * 360 / ((b.e - b.w) * 256)))));
    const X0 = lonToPx(b.w, z), X1 = lonToPx(b.e, z), Y0 = latToPx(b.n, z), Y1 = latToPx(b.s, z);

    for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) if (d[(y * cv.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const pad = 8, w = Math.max(1, x1 - x0 + 2 * pad), h = Math.max(1, y1 - y0 + 2 * pad), out = document.createElement('canvas'); out.width = w; out.height = h;
    out.getContext('2d').drawImage(cv, x0 - pad, y0 - pad, w, h, 0, 0, w, h);
    const now = new Date();
    job.finish = tier;
    job.signed = { name: bg.querySelector('#sgname').value.trim(), tier, total: T.find(t => t.f.id === tier).total, sig: out.toDataURL('image/png'), at: now.toISOString(), when: now.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) };
    if (/^\d/.test(job.name || '')) job.name = job.signed.name;
    touch(job); close(); renderJob(job, 'proposal'); toast('Signed — now tap Save PDF');
  };
  requestAnimationFrame(fit);
}
/* "# Title" starts a group, "- item" is a ✓ line, blank lines split paragraphs */
function parseTerms(txt) {
  const out = []; let cur = null, buf = [];
  const sec = () => cur || (out.push(cur = { title: '', paras: [] }), cur);
  const flush = () => { if (buf.length) { sec().paras.push({ text: buf.join(' ') }); buf = []; } };
  String(txt || '').split(/\r?\n/).forEach(line => {
    const l = line.trim();
    if (/^#+\s/.test(l)) { flush(); out.push(cur = { title: l.replace(/^#+\s*/, ''), paras: [] }); }
    else if (/^[xX✗×]\s+/.test(l)) { flush(); sec().paras.push({ text: l.replace(/^[xX✗×]\s+/, ''), bullet: true, no: true }); }
    else if (/^[-•*✓]\s*/.test(l) && l.length > 1) { flush(); sec().paras.push({ text: l.replace(/^[-•*✓]\s*/, ''), bullet: true }); }
    else if (!l) flush();
    else buf.push(l);
  });
  flush();
  return out.filter(t => t.title || t.paras.length);
}
/* shrink a page's content (never the page) until it fits on its letter sheet */
function fitPages() {
  document.querySelectorAll('.page').forEach(page => {
    const pad = page.querySelector('.pad'); if (!pad) return;
    pad.style.zoom = ''; pad.style.flex = ''; pad.style.height = '';
    const avail = page.clientHeight - pad.offsetTop;
    const foot = pad.lastElementChild;
    /* overflow of the content past the pad (the footer is pushed down by margin-top:auto, so measure the pad, not the page) */
    const need = () => Math.max(pad.scrollHeight - pad.clientHeight, foot.getBoundingClientRect().bottom - (page.getBoundingClientRect().bottom - 30 * (parseFloat(pad.style.zoom) || 1)));
    pad.style.flex = 'none'; pad.style.height = avail + 'px';
    if (need() <= 0.5) return;
    let z = 1;
    while (z > 0.7) {
      z = Math.round((z - 0.02) * 100) / 100;
      pad.style.zoom = z; pad.style.flex = 'none'; pad.style.height = (avail / z) + 'px';
      if (need() <= 0.5) break;
    }
  });
}
function projectTitle(job) {
  const kinds = [...new Set((job.pours || []).map(p => p.kind))];
  const n = { driveway: 'driveway', walkway: 'walkway', patio: 'patio' };
  if (!kinds.length) return 'New concrete';
  const w = kinds.map(k => n[k]);
  const t = w.length === 1 ? w[0] : w.slice(0, -1).join(', ') + ' & ' + w[w.length - 1];
  return 'New ' + t;
}

  document.querySelectorAll('[data-pd]').forEach(b => b.onclick = () => { const [ph] = P.proof.splice(+b.dataset.pd, 1); idb.del('proof:' + ph.id); save(); renderSettings(); });
  document.querySelectorAll('[data-pu]').forEach(b => b.onclick = () => { const i = +b.dataset.pu; [P.proof[i - 1], P.proof[i]] = [P.proof[i], P.proof[i - 1]]; save(); renderSettings(); });
  $('#proofadd').onchange = async e => {
    let n = 0;
    for (const f of e.target.files) {
      const url = await shrinkImage(f, 1600).catch(() => null);
      if (!url) { toast(`Couldn't read ${f.name} — try saving it as JPG`); continue; }
      const id = uid(); await idb.set('proof:' + id, url); P.proof.push({ id, caption: '' }); n++;
    }
    save(); renderSettings(); if (n) toast(`Added ${n} photo${n > 1 ? 's' : ''}`);
  };
}
/* read an image file and return a JPEG data URL no wider/taller than max px */
function shrinkImage(file, max, type) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(type === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85)); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(); };
    im.src = u;
  });
}

idb.get('logo').then(d => { if (d && !LOGO) { LOGO = d; if (/proposal|sub|settings/.test(location.hash)) route(); } });
route();
</script>
